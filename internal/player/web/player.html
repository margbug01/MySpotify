<!doctype html>
<meta charset="utf-8">
<title>Vinyl</title>
<style>
/* A music video's page shows its picture, filling the web view. */
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
video { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
<script src="/hls.js"></script>
<script>
// Plays what Vinyl asks, one track at a time, each in an audio element of
// its own, so that the events of one gone never pass for the next's: a
// video element in the page that plays music videos, which shows it.
let cur = null, volume = 1;
// fadeSecs is the requested overlap; leaving is the previous song until
// the new one starts playing or the previous one ends.
let fadeSecs = 0, leaving = null;
// keySystem decrypts what plays: Widevine, or FairPlay where WebKit plays.
const ks = typeof location === 'undefined' ? null : /[?&]ks=([^&]*)/.exec(location.search);
const keySystem = ks ? decodeURIComponent(ks[1]) : 'com.widevine.alpha';
const videoPage = typeof location !== 'undefined' && /[?&]video=1(&|$)/.test(location.search);
const send = (gen, type, t, msg, seq) => fetch('/event', {
  method: 'POST',
  body: JSON.stringify({ gen, type, t: t || 0, msg: msg || '', seq: seq || 0 }),
}).catch(() => {});

// setVolume sets the volume of t: the listener's, times its own level, which
// fades as songs overlap.
function setVolume(t) { t.a.volume = volume * t.level; }

function finishOverlap() {
  if (leaving) {
    const old = leaving;
    leaving = null;
    destroy(old);
  }
  if (cur) {
    clearInterval(cur.ramp);
    cur.lead = 0;
    cur.level = 1;
    setVolume(cur);
  }
}

// Start both ramps when the new element plays, using the audible time left.
function startOverlap(t) {
  const old = leaving;
  const secs = old && !old.a.ended && !old.a.paused ? Math.min(t.lead, old.a.duration - old.a.currentTime) : 0;
  t.lead = 0;
  if (!(secs > 0)) return finishOverlap();
  const start = performance.now();
  const oldLevel = old.level;
  t.ramp = setInterval(() => {
    const angle = Math.min(1, (performance.now() - start) / (secs * 1000)) * Math.PI / 2;
    t.level = Math.sin(angle);
    old.level = oldLevel * Math.cos(angle);
    setVolume(t);
    setVolume(old);
    if (angle >= Math.PI / 2) finishOverlap();
  }, 50);
}

// destroy lets go of t, its timers and its element.
function destroy(t) {
  clearTimeout(t.pauseTimer);
  clearTimeout(t.endTimer);
  clearInterval(t.watch);
  clearInterval(t.ramp);
  t.hls.destroy();
  // Its source joined to the equalizer's filters would keep the element,
  // and every track's before it, alive.
  if (t.src) t.src.disconnect();
  t.a.remove();
}

// rest stops loading what plays once it has been paused half a minute; wake
// loads again, from where it is, what that stopped.
function rest(t) {
  clearTimeout(t.pauseTimer);
  t.pauseTimer = setTimeout(() => {
    if (cur === t && !t.want) { t.hls.stopLoad(); t.stopped = true; }
  }, 30000);
}
function wake(t) {
  clearTimeout(t.pauseTimer);
  if (t.stopped) { t.hls.startLoad(t.a.currentTime); t.stopped = false; }
}

// The media keys' and Control Center's skips and seeks come to the page,
// which WebKit shows the system as what plays: Vinyl carries them out.
// WebKit forgets what the page handles while no element plays, as when the
// page loads, and offers the system its own commands instead, which skip 15
// seconds rather than to the next track (#30): each element takes them anew
// as it plays.
// What the page handles is all WebKit offers beside play and pause, so
// seeking is one of them.
function takeSystemActions() {
  if (typeof navigator === 'undefined' || !navigator.mediaSession) return;
  for (const [action, type] of [['nexttrack', 'system-next'], ['previoustrack', 'system-previous'], ['seekto', 'system-seek']]) {
    try {
      navigator.mediaSession.setActionHandler(action, (d) => { if (cur) send(cur.gen, type, action === 'seekto' ? d.seekTime : cur.a.currentTime); });
    } catch {}
  }
}

// certificate is FairPlay's, asked for once: the licence service's key.
let certificate = null;

// nativeFairPlay plays as Safari's web player does, in WebKit's own HLS:
// it asks for the key of the skd:// URI the manifest names (webkitneedkey),
// which the prefixed key system turns into a licence request with the
// asset's ID and the certificate. It answers what load uses of hls.js.
function nativeFairPlay(gen, a) {
  const handlers = [];
  let session = null;
  const fail = (details, code) => handlers.forEach((h) => h(Hls.Events.ERROR, { fatal: true, type: Hls.ErrorTypes.KEY_SYSTEM_ERROR, details, response: code ? { code } : undefined }));
  a.addEventListener('webkitneedkey', async (e) => {
    try {
      if (!certificate) certificate = fetch('/cert?gen=' + gen).then((r) => {
        if (!r.ok) throw new Error('certificate http=' + r.status);
        return r.arrayBuffer();
      });
      const cert = new Uint8Array(await certificate.catch((err) => { certificate = null; throw err; }));
      const init = new Uint8Array(e.initData);
      const view = new DataView(init.buffer, init.byteOffset, init.byteLength);
      const uri = init.byteLength > 4 && view.getUint32(0, true) + 4 === init.byteLength
        ? String.fromCharCode(...new Uint16Array(init.slice(4).buffer)) : '';
      const id = /^skd:\/\/([0-9a-fA-F]+)/.exec(uri);
      if (!id) throw new Error('no skd:// asset in ' + JSON.stringify(uri));
      // The init data, then the asset's ID and the certificate, each after
      // its length: what the prefixed key system takes.
      const data = new Uint8Array(init.byteLength + 4 + id[1].length * 2 + 4 + cert.byteLength);
      const out = new DataView(data.buffer);
      let at = 0;
      data.set(init, at); at += init.byteLength;
      out.setUint32(at, id[1].length * 2, true); at += 4;
      for (const c of id[1]) { out.setUint16(at, c.charCodeAt(0), true); at += 2; }
      out.setUint32(at, cert.byteLength, true); at += 4;
      data.set(cert, at);
      if (!a.webkitKeys) a.webkitSetMediaKeys(new WebKitMediaKeys('com.apple.fps.1_0'));
      session = a.webkitKeys.createSession('video/mp4', data);
      session.addEventListener('webkitkeymessage', async (m) => {
        const r = await fetch('/license?gen=' + gen, { method: 'POST', body: m.message });
        if (!r.ok) return fail('keySystemLicenseRequestFailed', r.status);
        session.update(new Uint8Array(await r.arrayBuffer()));
      });
      session.addEventListener('webkitkeyerror', () => {
        const err = session.error;
        fail('keySystemSessionError ' + (err ? err.code + '/' + err.systemCode : ''));
      });
    } catch (err) {
      fail('keySystemNoSession ' + err.message);
    }
  });
  return native(a, handlers, () => { if (session) session.close(); });
}

// native plays in the media element itself: HLS, as WebKit does, or a
// file as it is, as every engine does. It answers what load uses of hls.js;
// handlers hear its key system's errors, and close closes what it opened.
function native(a, handlers, close) {
  let src = '';
  return {
    on(name, fn) { if (name === Hls.Events.ERROR) handlers.push(fn); },
    loadSource(s) { src = s; if (a.src) a.src = s; },
    attachMedia() { a.src = src; },
    // The element loads on its own, and stops while paused.
    startLoad() {},
    stopLoad() {},
    recoverMediaError() {
      const at = a.currentTime;
      a.addEventListener('loadedmetadata', () => { a.currentTime = at; }, { once: true });
      a.src = src;
    },
    destroy() {
      close();
      a.removeAttribute('src');
      a.load();
    },
  };
}

// eq is the equalizer once turned on: one filter a band, between every
// track and the speakers. Turned off, the filters go flat but stay: an element
// feeds one source for good.
const eqHz = [60, 150, 400, 1000, 2400, 15000];
let eq = null;
function eqAttach(t) {
  if (!eq || t.src) return;
  try {
    t.src = eq.ctx.createMediaElementSource(t.a);
    t.src.connect(eq.filters[0]);
  } catch {}
}

window.vinyl = {
  // eq sets the gain of each band in dB, or null for none.
  eq(gains) {
    if (!eq) {
      if (!gains) return;
      const ctx = new AudioContext();
      const filters = eqHz.map((f, i) => {
        const b = ctx.createBiquadFilter();
        b.type = i === 0 ? 'lowshelf' : i === eqHz.length - 1 ? 'highshelf' : 'peaking';
        b.frequency.value = f;
        return b;
      });
      filters.forEach((b, i) => b.connect(filters[i + 1] || ctx.destination));
      eq = { ctx, filters };
    }
    eq.filters.forEach((b, i) => { b.gain.value = gains ? gains[i] || 0 : 0; });
    eq.ctx.resume();
    if (cur) eqAttach(cur);
  },
  // kind is 'file' for a file that plays as it is, an episode's where its
  // podcast keeps it: no manifest, no key system.
  // lead, if the song before is leaving, is the seconds this one fades in over.
  load(gen, kind, lead) {
    const file = kind === 'file';
    if (cur) vinyl.unload(cur.gen);
    if (!(lead > 0 && leaving)) {
      finishOverlap();
      lead = 0;
    }
    const a = document.createElement(videoPage ? 'video' : 'audio');
    a.volume = lead > 0 ? 0 : volume;
    a.playsInline = true;
    document.body.append(a);
    const hls = file ? native(a, [], () => {}) : keySystem === 'com.apple.fps.1_0' ? nativeFairPlay(gen, a) : new Hls({
      emeEnabled: true,
      maxBufferLength: 30,
      maxMaxBufferLength: 60,
      // A video's 30 seconds take megabytes; its size no larger than it
      // shows.
      maxBufferSize: (videoPage ? 60 : 2) * 1024 * 1024,
      capLevelToPlayerSize: videoPage,
      backBufferLength: 30,
      drmSystems: { [keySystem]: { licenseUrl: '/license?gen=' + gen, serverCertificateUrl: '/cert?gen=' + gen } },
    });
    // tries counts the recoveries, two at most; want is whether to play;
    // asked is how many times Vinyl had asked to play or pause.
    const t = { gen, a, hls, seek: null, tries: 0, want: false, asked: 0, endSeq: 0, ending: false, lastTime: 0, still: 0, heard: false, near: false, lead: lead > 0 ? lead : 0, level: lead > 0 ? 0 : 1 };
    eqAttach(t);
    const finish = (reason) => {
      if (cur !== t || t.ending) return;
      t.ending = true;
      const seq = ++t.endSeq;
      const report = async () => {
        if (cur !== t || !t.ending || t.endSeq !== seq) return;
        try {
          const response = await fetch('/event', {
            method: 'POST', signal: AbortSignal.timeout(5000),
            body: JSON.stringify({ gen, type: 'ended', t: a.currentTime, seq, msg: reason }),
          });
          if (!response.ok) throw new Error('event http=' + response.status);
        } catch {
          if (cur === t && t.ending && t.endSeq === seq) t.endTimer = setTimeout(report, 1000);
        }
      };
      report();
    };
    t.watch = setInterval(() => {
      const position = a.currentTime;
      const moved = position > t.lastTime + 0.001;
      t.lastTime = position;
      const duration = a.duration;
      const tail = Number.isFinite(duration) && duration > 0 && position >= duration - 0.25 && position <= duration + 0.25;
      const buffered = a.buffered;
      const complete = buffered.length > 0 && buffered.start(buffered.length - 1) <= position && buffered.end(buffered.length - 1) >= duration - 0.05;
      if (!t.want || t.ending || !t.heard || a.paused || a.seeking || a.error || !tail || !complete || moved) {
        t.still = 0;
        return;
      }
      if (++t.still >= 4) finish('tail stalled');
    }, 1000);
    // A network or media error is tried again; a licence turned down, or a
    // third error, is reported: Vinyl knows how the licence service answered.
    const fail = (what) => {
      const again = t.tries < 2 && what.type !== 'licence';
      if (!again) return send(gen, 'error', a.currentTime, what.msg);
      t.tries++;
      send(gen, 'retry', a.currentTime, what.msg);
      if (what.type === Hls.ErrorTypes.NETWORK_ERROR) {
        // Without the manifest, there is nothing to start loading from.
        if (what.details.startsWith('manifest')) hls.loadSource(src); else hls.startLoad();
      } else {
        hls.recoverMediaError();
        if (t.want) a.play().catch(() => {});
      }
    };
    hls.on(Hls.Events.ERROR, (e, d) => {
      if (!d.fatal) return;
      const msg = d.type + ' ' + d.details + (d.response && d.response.code ? ' http=' + d.response.code : '');
      fail({ type: d.type === Hls.ErrorTypes.KEY_SYSTEM_ERROR ? 'licence' : d.type, details: d.details, msg });
    });
    for (const n of ['playing', 'pause', 'waiting', 'seeked']) a.addEventListener(n, () => {
      if (n === 'playing') {
        t.heard = true;
        takeSystemActions();
        if (cur === t && t.lead) startOverlap(t);
      }
      // WebKit pauses the element itself for the system: the media keys,
      // Control Center, or an app such as Mami pausing what plays while one
      // talks. Vinyl hears it as the system's; a pause it asked for, or the
      // one at the end, is its own.
      if (n === 'pause' && cur === t && t.want && a.paused && !a.ended) {
        finishOverlap();
        t.want = false;
        t.still = 0;
        rest(t);
        return send(gen, 'system-pause', a.currentTime, '', t.asked);
      }
      send(gen, n, a.currentTime);
    });
    // And plays it again for them, where a long pause may have stopped
    // loading it.
    a.addEventListener('play', () => {
      if (cur !== t || t.want || a.paused) return;
      t.want = true;
      wake(t);
      send(gen, 'system-play', a.currentTime, '', t.asked);
    });
    a.addEventListener('ended', () => {
      if (leaving === t) finishOverlap();
      else finish('media ended');
    });
    a.addEventListener('seeking', () => { t.still = 0; t.heard = false; });
    a.addEventListener('timeupdate', () => {
      send(gen, 'time', a.currentTime);
      // The song nears its end: Vinyl may start the next one over it.
      if (fadeSecs > 0 && cur === t && t.want && !t.near && !file && !videoPage && a.duration > fadeSecs * 3 && a.duration - a.currentTime <= fadeSecs + 0.5) {
        t.near = true;
        send(gen, 'near', a.currentTime);
      }
    });
    a.addEventListener('error', () => fail({ type: Hls.ErrorTypes.MEDIA_ERROR, details: '', msg: 'media ' + (a.error ? a.error.code + ' ' + a.error.message : '') }));
    a.addEventListener('loadedmetadata', () => {
      if (t.seek != null) { a.currentTime = t.seek; t.seek = null; }
      if (file && Number.isFinite(a.duration)) send(gen, 'duration', a.duration);
    });
    const src = '/m/' + gen + (file ? '/0' : '/track.m3u8');
    hls.loadSource(src);
    hls.attachMedia(a);
    cur = t;
  },
  play(gen, asked) {
    if (!cur || cur.gen !== gen) return;
    const a = cur.a;
    cur.want = true;
    if (asked) cur.asked = asked;
    wake(cur);
    const p = a.play();
    if (p) p.catch((e) => { if (e.name !== 'AbortError') send(gen, 'error', a.currentTime, 'play ' + e.name + ': ' + e.message); });
  },
  pause(gen, asked) {
    if (!cur || cur.gen !== gen) return;
    finishOverlap();
    const t = cur;
    t.want = false;
    if (asked) t.asked = asked;
    t.still = 0;
    t.a.pause();
    rest(t);
  },
  seek(gen, t) {
    if (!cur || cur.gen !== gen) return;
    finishOverlap();
    cur.near = false;
    cur.ending = false;
    cur.still = 0;
    cur.heard = false;
    clearTimeout(cur.endTimer);
    if (cur.a.readyState >= 1) cur.a.currentTime = t; else cur.seek = t;
  },
  volume(v) {
    volume = Math.max(0, Math.min(1, v));
    if (cur) setVolume(cur);
    if (leaving) setVolume(leaving);
  },
  // crossfade is how many seconds a song overlaps the next, 0 for none.
  crossfade(secs) { fadeSecs = Math.max(0, secs); },
  // Keep the song audible while its replacement opens.
  leave(gen) {
    if (!cur || cur.gen !== gen) return;
    finishOverlap();
    leaving = cur;
    clearInterval(leaving.watch);
    cur = null;
  },
  // meta names what plays to the system, which WebKit shows it the page
  // as: titled Vinyl, naming no song, without it.
  meta(m) {
    if (typeof MediaMetadata === 'undefined') return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: m.title, artist: m.artist, album: m.album,
      artwork: m.artwork ? [{ src: m.artwork }] : [],
    });
    takeSystemActions();
  },
  // rate is how fast the track plays, its pitch kept: the default too, which
  // a load, as hls.js recovering, puts it back to.
  rate(gen, r) {
    if (!cur || cur.gen !== gen) return;
    cur.a.defaultPlaybackRate = r;
    cur.a.playbackRate = r;
  },
  unload(gen) {
    if (leaving && leaving.gen === gen) finishOverlap();
    if (!cur || cur.gen !== gen) return;
    const old = cur;
    cur = null;
    finishOverlap();
    destroy(old);
  },
};
send(0, 'ready');
const controlKey = typeof location === 'undefined' ? null : /^#control=([a-f0-9]{64})$/.exec(location.hash);
if (controlKey) {
  history.replaceState(null, '', location.pathname + location.search);
  (async () => {
    for (;;) {
      try {
        const response = await fetch('/commands', { headers: { 'X-Vinyl-Key': controlKey[1] } });
        if (!response.ok) return;
        const command = await response.json();
        if (command) Function(command)();
      } catch {
        return;
      }
    }
  })();
}
</script>
