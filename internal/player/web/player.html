<!doctype html>
<meta charset="utf-8">
<title>Vinyl</title>
<style>
/* A music video's page shows its picture, filling the web view. */
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
video { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
<script src="/hls.js"></script>
<script>
// Plays what Vinyl asks, one track at a time, each in an audio element of
// its own, so that the events of one gone never pass for the next's: a
// video element in the page that plays music videos, which shows it.
let cur = null, volume = 1;
// keySystem decrypts what plays: Widevine, or FairPlay where WebKit plays.
const ks = typeof location === 'undefined' ? null : /[?&]ks=([^&]*)/.exec(location.search);
const keySystem = ks ? decodeURIComponent(ks[1]) : 'com.widevine.alpha';
const videoPage = typeof location !== 'undefined' && /[?&]video=1(&|$)/.test(location.search);
const send = (gen, type, t, msg) => fetch('/event', {
  method: 'POST',
  body: JSON.stringify({ gen, type, t: t || 0, msg: msg || '' }),
}).catch(() => {});

// certificate is FairPlay's, asked for once: the licence service's key.
let certificate = null;

// nativeFairPlay plays as Safari's web player does, in WebKit's own HLS:
// it asks for the key of the skd:// URI the manifest names (webkitneedkey),
// which the prefixed key system turns into a licence request with the
// asset's ID and the certificate. It answers what load uses of hls.js.
function nativeFairPlay(gen, a) {
  const handlers = [];
  let src = '', session = null;
  const fail = (details, code) => handlers.forEach((h) => h(Hls.Events.ERROR, { fatal: true, type: Hls.ErrorTypes.KEY_SYSTEM_ERROR, details, response: code ? { code } : undefined }));
  a.addEventListener('webkitneedkey', async (e) => {
    try {
      if (!certificate) certificate = fetch('/cert?gen=' + gen).then((r) => {
        if (!r.ok) throw new Error('certificate http=' + r.status);
        return r.arrayBuffer();
      });
      const cert = new Uint8Array(await certificate.catch((err) => { certificate = null; throw err; }));
      const init = new Uint8Array(e.initData);
      const view = new DataView(init.buffer, init.byteOffset, init.byteLength);
      const uri = init.byteLength > 4 && view.getUint32(0, true) + 4 === init.byteLength
        ? String.fromCharCode(...new Uint16Array(init.slice(4).buffer)) : '';
      const id = /^skd:\/\/([0-9a-fA-F]+)/.exec(uri);
      if (!id) throw new Error('no skd:// asset in ' + JSON.stringify(uri));
      // The init data, then the asset's ID and the certificate, each after
      // its length: what the prefixed key system takes.
      const data = new Uint8Array(init.byteLength + 4 + id[1].length * 2 + 4 + cert.byteLength);
      const out = new DataView(data.buffer);
      let at = 0;
      data.set(init, at); at += init.byteLength;
      out.setUint32(at, id[1].length * 2, true); at += 4;
      for (const c of id[1]) { out.setUint16(at, c.charCodeAt(0), true); at += 2; }
      out.setUint32(at, cert.byteLength, true); at += 4;
      data.set(cert, at);
      if (!a.webkitKeys) a.webkitSetMediaKeys(new WebKitMediaKeys('com.apple.fps.1_0'));
      session = a.webkitKeys.createSession('video/mp4', data);
      session.addEventListener('webkitkeymessage', async (m) => {
        const r = await fetch('/license?gen=' + gen, { method: 'POST', body: m.message });
        if (!r.ok) return fail('keySystemLicenseRequestFailed', r.status);
        session.update(new Uint8Array(await r.arrayBuffer()));
      });
      session.addEventListener('webkitkeyerror', () => {
        const err = session.error;
        fail('keySystemSessionError ' + (err ? err.code + '/' + err.systemCode : ''));
      });
    } catch (err) {
      fail('keySystemNoSession ' + err.message);
    }
  });
  return {
    on(name, fn) { if (name === Hls.Events.ERROR) handlers.push(fn); },
    loadSource(s) { src = s; if (a.src) a.src = s; },
    attachMedia() { a.src = src; },
    // WebKit loads on its own, and stops while paused.
    startLoad() {},
    stopLoad() {},
    recoverMediaError() {
      const at = a.currentTime;
      a.addEventListener('loadedmetadata', () => { a.currentTime = at; }, { once: true });
      a.src = src;
    },
    destroy() {
      if (session) session.close();
      a.removeAttribute('src');
      a.load();
    },
  };
}

window.vinyl = {
  load(gen) {
    vinyl.unload(cur && cur.gen);
    const a = document.createElement(videoPage ? 'video' : 'audio');
    a.volume = volume;
    a.playsInline = true;
    document.body.append(a);
    const hls = keySystem === 'com.apple.fps.1_0' ? nativeFairPlay(gen, a) : new Hls({
      emeEnabled: true,
      maxBufferLength: 30,
      maxMaxBufferLength: 60,
      // A video's 30 seconds take megabytes; its size no larger than it
      // shows.
      maxBufferSize: (videoPage ? 60 : 2) * 1024 * 1024,
      capLevelToPlayerSize: videoPage,
      backBufferLength: 30,
      drmSystems: { [keySystem]: { licenseUrl: '/license?gen=' + gen, serverCertificateUrl: '/cert?gen=' + gen } },
    });
    // tries counts the recoveries, two at most; want is whether to play.
    const t = { gen, a, hls, seek: null, tries: 0, want: false, endSeq: 0, ending: false, lastTime: 0, still: 0, heard: false };
    const finish = (reason) => {
      if (cur !== t || t.ending) return;
      t.ending = true;
      const seq = ++t.endSeq;
      const report = async () => {
        if (cur !== t || !t.ending || t.endSeq !== seq) return;
        try {
          const response = await fetch('/event', {
            method: 'POST', signal: AbortSignal.timeout(5000),
            body: JSON.stringify({ gen, type: 'ended', t: a.currentTime, seq, msg: reason }),
          });
          if (!response.ok) throw new Error('event http=' + response.status);
        } catch {
          if (cur === t && t.ending && t.endSeq === seq) t.endTimer = setTimeout(report, 1000);
        }
      };
      report();
    };
    t.watch = setInterval(() => {
      const position = a.currentTime;
      const moved = position > t.lastTime + 0.001;
      t.lastTime = position;
      const duration = a.duration;
      const tail = Number.isFinite(duration) && duration > 0 && position >= duration - 0.25 && position <= duration + 0.25;
      const buffered = a.buffered;
      const complete = buffered.length > 0 && buffered.start(buffered.length - 1) <= position && buffered.end(buffered.length - 1) >= duration - 0.05;
      if (!t.want || t.ending || !t.heard || a.paused || a.seeking || a.error || !tail || !complete || moved) {
        t.still = 0;
        return;
      }
      if (++t.still >= 4) finish('tail stalled');
    }, 1000);
    // A network or media error is tried again; a licence turned down, or a
    // third error, is reported: Vinyl knows how the licence service answered.
    const fail = (what) => {
      const again = t.tries < 2 && what.type !== 'licence';
      if (!again) return send(gen, 'error', a.currentTime, what.msg);
      t.tries++;
      send(gen, 'retry', a.currentTime, what.msg);
      if (what.type === Hls.ErrorTypes.NETWORK_ERROR) {
        // Without the manifest, there is nothing to start loading from.
        if (what.details.startsWith('manifest')) hls.loadSource(src); else hls.startLoad();
      } else {
        hls.recoverMediaError();
        if (t.want) a.play().catch(() => {});
      }
    };
    hls.on(Hls.Events.ERROR, (e, d) => {
      if (!d.fatal) return;
      const msg = d.type + ' ' + d.details + (d.response && d.response.code ? ' http=' + d.response.code : '');
      fail({ type: d.type === Hls.ErrorTypes.KEY_SYSTEM_ERROR ? 'licence' : d.type, details: d.details, msg });
    });
    for (const n of ['playing', 'pause', 'waiting', 'seeked']) a.addEventListener(n, () => {
      if (n === 'playing') t.heard = true;
      send(gen, n, a.currentTime);
    });
    a.addEventListener('ended', () => finish('media ended'));
    a.addEventListener('seeking', () => { t.still = 0; t.heard = false; });
    a.addEventListener('timeupdate', () => send(gen, 'time', a.currentTime));
    a.addEventListener('error', () => fail({ type: Hls.ErrorTypes.MEDIA_ERROR, details: '', msg: 'media ' + (a.error ? a.error.code + ' ' + a.error.message : '') }));
    a.addEventListener('loadedmetadata', () => {
      if (t.seek != null) { a.currentTime = t.seek; t.seek = null; }
    });
    const src = '/m/' + gen + '/track.m3u8';
    hls.loadSource(src);
    hls.attachMedia(a);
    cur = t;
  },
  play(gen) {
    if (!cur || cur.gen !== gen) return;
    const a = cur.a;
    cur.want = true;
    clearTimeout(cur.pauseTimer);
    if (cur.stopped) { cur.hls.startLoad(a.currentTime); cur.stopped = false; }
    const p = a.play();
    if (p) p.catch((e) => { if (e.name !== 'AbortError') send(gen, 'error', a.currentTime, 'play ' + e.name + ': ' + e.message); });
  },
  pause(gen) {
    if (!cur || cur.gen !== gen) return;
    const t = cur;
    t.want = false;
    t.still = 0;
    t.a.pause();
    clearTimeout(t.pauseTimer);
    t.pauseTimer = setTimeout(() => {
      if (cur === t && !t.want) { t.hls.stopLoad(); t.stopped = true; }
    }, 30000);
  },
  seek(gen, t) {
    if (!cur || cur.gen !== gen) return;
    cur.ending = false;
    cur.still = 0;
    cur.heard = false;
    clearTimeout(cur.endTimer);
    if (cur.a.readyState >= 1) cur.a.currentTime = t; else cur.seek = t;
  },
  volume(v) {
    volume = Math.max(0, Math.min(1, v));
    if (cur) cur.a.volume = volume;
  },
  unload(gen) {
    if (!cur || cur.gen !== gen) return;
    clearTimeout(cur.pauseTimer);
    clearTimeout(cur.endTimer);
    clearInterval(cur.watch);
    cur.hls.destroy();
    cur.a.remove();
    cur = null;
  },
};
send(0, 'ready');
</script>
